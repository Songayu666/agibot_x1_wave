control_frequecy: 1000
use_sim_handles: True

sub_joy_vel_name: /cmd_vel_limiter      # controller 接收的运动指令
sub_imu_data_name: /imu/data            # IMU数据
sub_joint_state_name: /joint_states     # 关节数据
pub_joint_cmd_name: /joint_cmd          # 关节控制指令

# Share complex-action trajectories with the real-robot configuration while
# adapting PD gains to the MuJoCo actuator model.
controller_import_file: ./cfg/control_module/rl_x1.yaml
controller_imports: [pd_greet_nod, pd_salute, pd_fist_greeting, pd_clap, pd_heart,
                     pd_welcome, pd_point_left, pd_point_right, pd_wipe_sweat,
                     pd_scratch_head, pd_arm_dance, pd_bow_wave, pd_greeting_combo]
controller_import_stiffness_scale: 4.0
controller_import_damping_scale: 0.4

# ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ control_modes list ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
robot_states:
  # 空闲模式 
  idle:
    trigger_topic: /idle_mode
    pre_states: [keep, stand_&_plan, keep_&_plan, walk_leg_&_plan, zero, stand, walk_leg, walk_leg_arm]
    controllers: [pd_idle]
  # keep模式
  keep:
    trigger_topic: /keep_mode
    pre_states: [idle, stand_&_plan, keep_&_plan, wa_&_plan, zero, stand, walk_leg, walk_leg_arm]
    controllers: [pd_keep]

  # 零模式
  zero:
    trigger_topic: /zero_mode
    pre_states: [idle, keep, stand, stand_&_plan]
    controllers: [pd_zero]
  # 站立模式
  stand:
    trigger_topic: /stand_mode
    pre_states: [zero, stand_&_plan, keep_&_plan, walk_leg_&_plan, walk_leg, walk_leg_arm, wave_forearm, wave_arm, wave_wrist,
                 greet_nod, salute, fist_greeting, clap, heart, welcome, point_left, point_right,
                 wipe_sweat, scratch_head, arm_dance, bow_wave, greeting_combo]
    controllers: [pd_zero, pd_stand]

  # 行走模式1
  walk_leg:
    trigger_topic: /walk_mode
    pre_states: [stand_&_plan, walk_leg_&_plan, stand, walk_leg_arm]
    controllers: [pd_zero, pd_stand, rl_walk_leg]
  # 行走模式2
  walk_leg_arm:
    trigger_topic: /walk_mode2
    pre_states: [stand_&_plan, walk_leg_&_plan, stand, walk_leg]
    controllers: [pd_zero, pd_stand, rl_walk_leg_shoulder]

  # plan模式
  stand_&_plan:
    trigger_topic: /plan_mode
    pre_states: [stand, stand_&_plan]
    controllers: [pd_zero, pd_stand, pd_plan]
  keep_&_plan:
    trigger_topic: /plan_mode
    pre_states: [keep, keep_&_plan]
    controllers: [pd_keep, pd_plan]
  walk_leg_&_plan:
    trigger_topic: /plan_mode
    pre_states: [walk_leg, walk_leg_&_plan]
    controllers: [pd_zero, pd_stand, rl_walk_leg, pd_plan]
  wave_forearm:
    trigger_topic: /wave_forearm
    pre_states: [stand, wave_forearm]
    controllers: [pd_zero, pd_stand, pd_wave_forearm]
  wave_arm:
    trigger_topic: /wave_arm
    pre_states: [stand, wave_arm]
    controllers: [pd_zero, pd_stand, pd_wave_arm]
  wave_wrist:
    trigger_topic: /wave_wrist
    pre_states: [stand, wave_wrist]
    controllers: [pd_zero, pd_stand, pd_wave_wrist]
  greet_nod:
    trigger_topic: /greet_nod
    pre_states: [stand, greet_nod]
    controllers: [pd_zero, pd_stand, pd_greet_nod]
  salute:
    trigger_topic: /salute
    pre_states: [stand, salute]
    controllers: [pd_zero, pd_stand, pd_salute]
  fist_greeting:
    trigger_topic: /fist_greeting
    pre_states: [stand, fist_greeting]
    controllers: [pd_zero, pd_stand, pd_fist_greeting]
  clap:
    trigger_topic: /clap
    pre_states: [stand, clap]
    controllers: [pd_zero, pd_stand, pd_clap]
  heart:
    trigger_topic: /heart
    pre_states: [stand, heart]
    controllers: [pd_zero, pd_stand, pd_heart]
  welcome:
    trigger_topic: /welcome
    pre_states: [stand, welcome]
    controllers: [pd_zero, pd_stand, pd_welcome]
  point_left:
    trigger_topic: /point_left
    pre_states: [stand, point_left]
    controllers: [pd_zero, pd_stand, pd_point_left]
  point_right:
    trigger_topic: /point_right
    pre_states: [stand, point_right]
    controllers: [pd_zero, pd_stand, pd_point_right]
  wipe_sweat:
    trigger_topic: /wipe_sweat
    pre_states: [stand, wipe_sweat]
    controllers: [pd_zero, pd_stand, pd_wipe_sweat]
  scratch_head:
    trigger_topic: /scratch_head
    pre_states: [stand, scratch_head]
    controllers: [pd_zero, pd_stand, pd_scratch_head]
  arm_dance:
    trigger_topic: /arm_dance
    pre_states: [stand, arm_dance]
    controllers: [pd_zero, pd_stand, pd_arm_dance]
  bow_wave:
    trigger_topic: /bow_wave
    pre_states: [stand, bow_wave]
    controllers: [pd_zero, pd_stand, pd_bow_wave]
  greeting_combo:
    trigger_topic: /greeting_combo
    pre_states: [stand, greeting_combo]
    controllers: [pd_zero, pd_stand, pd_greeting_combo]
# ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑


# ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ joint_list ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
